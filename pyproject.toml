[project]
name = "actmat"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gdown>=6.0.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
vision-language = [
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "h5py>=3.10.0",
    "huggingface-hub>=0.36.2",
    "numpy>=2.0.2",
    "open-clip-torch==2.10.1",
    "peft>=0.17.1",
    "pillow>=11.3.0",
    "promptsource",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "sentencepiece>=0.2.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.67.3",
    "transformers==4.57.6",
    "trl>=0.24.0",
    "setuptools<81",
]
olmo = [
    "ai2-olmes[gpu]",
    "numpy<2.3",
    "setuptools<81",
]
gemma = [
    "ai2-olmes[gpu]",
    "lm-eval>=0.4.4",
    "numpy<2.3",
    "setuptools<81",
]
# Polyglot (OLMo3-7B) experiment — two envs, mutually incompatible (numpy/datasets):
#   .venv-pg-mgsm     : MGSM via lm-eval native CoT  (numpy>=2, datasets>=4)
#   .venv-pg-mmlu-mrb : MMLU+MRB via the lighteval fork (vllm pins numpy<2, datasets<4)
# polyglot-mmlu-mrb is only the PyPI BASE; after `uv sync` you must overlay the
# ./lighteval fork submodule with `uv pip install -e ./lighteval --no-deps` (see README).
polyglot-mgsm = [
    "lm-eval==0.4.12",
    "transformers==4.57.6",
    "datasets>=4",
    "numpy>=2",
    "setuptools<81",
]
polyglot-mmlu-mrb = [
    "lighteval>=0.10.0",
    "vllm==0.10.1.1",
    "inspect-ai>=0.3.140",
    "more-itertools>=10",   # fork's vllm backend imports it; --no-deps overlay skips it otherwise
    "transformers==4.57.6",
    "setuptools<81",
]

[tool.uv]
conflicts = [
    [
        { group = "vision-language" },
        { group = "olmo" },
        { group = "gemma" },
        { group = "polyglot-mgsm" },
        { group = "polyglot-mmlu-mrb" },
    ],
]

[tool.uv.sources]
promptsource = { git = "https://github.com/bigscience-workshop/promptsource.git" }
ai2-olmes = { path = "./olmes", editable = false }
